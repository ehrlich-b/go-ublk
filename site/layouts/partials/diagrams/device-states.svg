<svg viewBox="0 0 800 400" role="img" aria-labelledby="dev-title dev-desc" xmlns="http://www.w3.org/2000/svg">
<title id="dev-title">ublk device state machine</title>
<desc id="dev-desc">ADD_DEV creates a device in state DEAD. START_DEV moves it to LIVE once every tag is fetched. STOP_DEV, or a server exit without a recovery flag, removes the disk and returns to DEAD. With USER_RECOVERY, a server exit (after QUIESCE_DEV, for a planned hand-off) moves a live device to QUIESCED, or to FAIL_IO with USER_RECOVERY_FAIL_IO. START_USER_RECOVERY, fetching every tag and END_USER_RECOVERY return it to LIVE. DEL_DEV deletes the device.</desc>
<defs>
<marker id="ah-dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
<marker id="ah-dev-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent"/></marker>
</defs>
<circle cx="95" cy="40" r="6" class="arrowhead"/>
<line x1="95" y1="46" x2="95" y2="146" class="line" marker-end="url(#ah-dev)"/>
<text x="105" y="88" class="t-mono">ADD_DEV</text>
<text x="105" y="104" class="t-mono">SET_PARAMS</text>
<rect x="20" y="150" width="150" height="60" rx="8" class="box"/>
<text x="95" y="174" text-anchor="middle" class="t-title">Added</text>
<text x="95" y="194" text-anchor="middle" class="t-mono t-small">UBLK_S_DEV_DEAD</text>
<rect x="290" y="150" width="170" height="60" rx="8" class="box-alt"/>
<text x="375" y="174" text-anchor="middle" class="t-title">Live: /dev/ublkbN</text>
<text x="375" y="194" text-anchor="middle" class="t-mono t-small">UBLK_S_DEV_LIVE</text>
<rect x="600" y="150" width="180" height="60" rx="8" class="box"/>
<text x="690" y="174" text-anchor="middle" class="t-title">Stopped, no disk</text>
<text x="690" y="194" text-anchor="middle" class="t-mono t-small">UBLK_S_DEV_DEAD</text>
<rect x="620" y="22" width="160" height="50" rx="8" class="box-dashed"/>
<text x="700" y="44" text-anchor="middle" class="t-title">Deleted</text>
<text x="700" y="61" text-anchor="middle" class="t-small">device ID reusable</text>
<rect x="150" y="290" width="500" height="100" rx="10" class="box-dashed"/>
<text x="164" y="308" class="t-band">NO SERVER, RECOVERABLE</text>
<rect x="170" y="320" width="215" height="56" rx="8" class="box"/>
<text x="277" y="342" text-anchor="middle" class="t-title">Quiesced: new I/O waits</text>
<text x="277" y="362" text-anchor="middle" class="t-mono t-small">UBLK_S_DEV_QUIESCED</text>
<rect x="415" y="320" width="215" height="56" rx="8" class="box"/>
<text x="522" y="342" text-anchor="middle" class="t-title">Fail I/O: new I/O errors</text>
<text x="522" y="362" text-anchor="middle" class="t-mono t-small">UBLK_S_DEV_FAIL_IO</text>
<line x1="170" y1="170" x2="286" y2="170" class="line-accent" marker-end="url(#ah-dev-a)"/>
<text x="228" y="162" text-anchor="middle" class="t-mono">START_DEV</text>
<line x1="460" y1="170" x2="596" y2="170" class="line" marker-end="url(#ah-dev)"/>
<text x="528" y="162" text-anchor="middle" class="t-mono">STOP_DEV</text>
<text x="528" y="190" text-anchor="middle" class="t-small">or the server exits</text>
<text x="528" y="204" text-anchor="middle" class="t-small">without a recovery flag</text>
<line x1="700" y1="150" x2="700" y2="76" class="line" marker-end="url(#ah-dev)"/>
<text x="710" y="118" class="t-mono">DEL_DEV</text>
<line x1="400" y1="210" x2="400" y2="286" class="line" marker-end="url(#ah-dev)"/>
<text x="410" y="240" class="t-small">server exits with USER_RECOVERY</text>
<text x="410" y="255" class="t-small">(after QUIESCE_DEV, for a planned hand-off)</text>
<polyline points="200,286 200,194 286,194" class="line-accent" marker-end="url(#ah-dev-a)"/>
<text x="190" y="232" text-anchor="end" class="t-mono t-small">START_USER_RECOVERY</text>
<text x="190" y="247" text-anchor="end" class="t-small">new server fetches every tag</text>
<text x="190" y="262" text-anchor="end" class="t-mono t-small">END_USER_RECOVERY</text>
<line x1="640" y1="290" x2="676" y2="214" class="line" marker-end="url(#ah-dev)"/>
<text x="668" y="262" class="t-mono t-small">STOP_DEV</text>
</svg>
